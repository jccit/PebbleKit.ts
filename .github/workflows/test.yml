name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Install Pebble SDK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-2.0-0 \
            libglib2.0-0 \
            libpixman-1-0 \
            zlib1g \
            libsndio7.0 \
            qemu-system-data

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Pebble CLI
        run: uv tool install pebble-tool --python 3.13

      - name: Add Pebble CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pebble SDK
        run: pebble sdk install latest

      - name: Link QEMU keymaps for headless emulator
        run: |
          PC_BIOS="${HOME}/.pebble-sdk/SDKs/current/toolchain/lib/pc-bios"
          if [ ! -d "${PC_BIOS}" ]; then
            echo "Expected pc-bios at ${PC_BIOS}"
            ls -la "${HOME}/.pebble-sdk/SDKs/current/toolchain/lib/" || true
            exit 1
          fi
          ln -sfn /usr/share/qemu/keymaps "${PC_BIOS}/keymaps"

      - name: Install Node dependencies
        run: npm install

      - name: Type check
        run: npm run check-types

      - name: Build CLI
        run: npm run build

      - name: Install test-app dependencies
        working-directory: tests/test-app
        run: npm install

      - name: Run end-to-end tests
        working-directory: tests/test-app
        run: npm run test
